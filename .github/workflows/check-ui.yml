# Fork-only helper: type-check and test the UI package on every push,
# so changes can be verified without building the app locally.
name: Check UI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and locale check
        run: pnpm --filter @ynotv/ui typecheck

      - name: Unit tests
        run: pnpm --filter @ynotv/ui test

      - name: CSS and token lint
        working-directory: packages/ui
        run: |
          node ../../scripts/check-globals.mjs
          node ../../scripts/audit-tokens.mjs
          node ../../scripts/check-css.mjs src
